<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduX — Pilot Preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1f2e;
    --ink-soft:#5b6072;
    --ink-faint:#9aa1b2;
    --bg:#f4f5fa;
    --card:#ffffff;
    --line:#eceef4;
    --navy:#303069;
    --navy-deep:#1f1f4d;
    --cyan:#1cbeee;
    --good:#1f9d6c;
    --good-bg:#eaf9f2;
    --bad:#e0503b;
    --bad-bg:#fdeeeb;
    --shadow:0 30px 60px -28px rgba(48,48,105,0.28), 0 6px 16px -6px rgba(48,48,105,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -8%, rgba(48,48,105,0.09), transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    padding:64px 18px 70px;
  }
  .wrap{width:100%;max-width:clamp(520px, 40vw, 760px);}
  .topbar{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:30px;}
  .brand{
    display:flex;align-items:center;gap:6px;cursor:pointer;
    font-family:'Sora',sans-serif;font-size:14px;letter-spacing:0.01em;
  }
  .brand .script{font-style:italic;font-weight:600;color:var(--navy);opacity:0.6;}
  .brand b{color:var(--navy);font-weight:800;font-size:15px;}
  .brand .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--ink-faint);margin:0 2px;}
  .brand .sub{color:var(--ink-faint);font-weight:500;font-size:12.5px;font-style:normal;}
  .timer-pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    font-family:'Sora',sans-serif;font-weight:700;font-size:13px;
    background:#fff;border:1px solid var(--line);color:var(--ink-soft);
    padding:6px 13px;border-radius:20px;display:none;align-items:center;gap:6px;
  }
  .timer-pill.show{display:flex;}
  .timer-pill.low{color:var(--bad);border-color:var(--bad);background:var(--bad-bg);}
  .timer-pill .tdot{width:6px;height:6px;border-radius:50%;background:var(--cyan);}
  .timer-pill.low .tdot{background:var(--bad);}

  .progress-row{display:flex;gap:5px;margin-bottom:26px;}
  .seg{flex:1;height:4px;border-radius:3px;background:var(--line);overflow:hidden;position:relative;}
  .seg::after{
    content:'';position:absolute;inset:0;border-radius:3px;
    background:var(--navy);transform:scaleX(0);transform-origin:left;
    transition:transform .35s ease;
  }
  .seg.done::after{transform:scaleX(1);background:var(--navy);opacity:0.5;}
  .seg.current::after{transform:scaleX(1);background:var(--cyan);box-shadow:0 0 10px rgba(28,190,238,0.55);}

  .card{
    background:var(--card);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:clamp(38px, 3vw, 54px) clamp(34px, 3.2vw, 50px) clamp(32px, 2.6vw, 44px);
    animation:riseIn .4s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ---- hub ---- */
  .hub-title{text-align:center;margin-bottom:26px;}
  .hub-title h1{font-family:'Sora',sans-serif;font-weight:800;font-size:24px;margin:0 0 6px;}
  .hub-title p{color:var(--ink-faint);font-size:13.5px;margin:0;}
  .hub-grid{display:flex;flex-direction:column;gap:14px;}
  .tier-card{
    border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    cursor:pointer;transition:border-color .15s, transform .12s, box-shadow .15s;
    background:#fff;
  }
  .tier-card:hover{border-color:var(--navy);transform:translateY(-1px);box-shadow:0 12px 28px -18px rgba(48,48,105,0.35);}
  .tier-card .tname{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;margin-bottom:4px;}
  .tier-card .tmeta{font-size:12.5px;color:var(--ink-faint);line-height:1.5;}
  .tier-card .tright{text-align:right;flex-shrink:0;}
  .tier-card .tprice{font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:var(--navy);}
  .tier-card .tprice.free{color:var(--good);}
  .tier-card .tunit{font-size:11px;color:var(--ink-faint);font-weight:500;}
  .lock-badge{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
    color:var(--navy);background:rgba(48,48,105,0.08);padding:2px 8px;border-radius:8px;margin-top:6px;
  }

  /* ---- intro / paywall ---- */
  .intro{text-align:center;padding:12px 4px 6px;}
  .intro h1{
    font-family:'Sora',sans-serif;font-weight:800;font-size:25px;
    color:var(--ink);margin:0 0 10px;letter-spacing:-0.01em;
  }
  .intro .pills{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0 22px;}
  .pill{
    font-size:12px;font-weight:600;color:var(--navy);
    background:rgba(48,48,105,0.07);padding:6px 13px;border-radius:20px;
  }
  .intro p{color:var(--ink-soft);font-size:14px;line-height:1.6;max-width:400px;margin:0 auto 26px;}
  .price-tag{font-family:'Sora',sans-serif;font-weight:800;font-size:32px;color:var(--ink);margin:14px 0 4px;}
  .price-tag .unit{font-size:14px;color:var(--ink-faint);font-weight:500;}
  .mock-note{font-size:11.5px;color:var(--ink-faint);margin-top:16px;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
    background:var(--navy);color:#fff;border:none;
    padding:13px 26px;border-radius:12px;cursor:pointer;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 10px 24px -10px rgba(48,48,105,0.55);
  }
  .btn:hover{background:var(--navy-deep);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{
    background:transparent;color:var(--navy);box-shadow:none;
    border:1.5px solid rgba(48,48,105,0.18);
  }
  .btn.ghost:hover{background:rgba(48,48,105,0.05);}
  .btn:disabled{opacity:0.4;cursor:default;transform:none;}

  .meta{
    font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .meta b{color:var(--cyan);}
  .meta .src-tag{
    font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:none;
    background:rgba(48,48,105,0.08);color:var(--navy);padding:2px 8px;border-radius:8px;
  }
  .problem{font-size:clamp(17.5px, 1.1vw, 21px);line-height:1.65;margin-bottom:18px;}

  .diagram-box{
    display:flex;justify-content:center;margin:4px 0 22px;
    background:#fafbfe;border:1px solid var(--line);border-radius:14px;padding:16px;
  }
  .diagram-box img{max-width:220px;height:auto;display:block;}
  .diagram-box svg{max-width:260px;height:auto;display:block;}

  .choices{display:flex;flex-direction:column;gap:9px;}
  .choice{
    text-align:left;border:1.5px solid var(--line);background:#fff;
    border-radius:12px;padding:clamp(13px,1vw,17px) clamp(16px,1.2vw,20px);
    font-size:clamp(15px, 0.9vw, 17px);color:var(--ink);
    cursor:pointer;display:flex;gap:11px;align-items:center;
    transition:background .15s, border-color .15s, transform .12s;
  }
  .choice:hover:not(:disabled){border-color:#d3d6e6;background:#fafbfe;}
  .choice:active:not(:disabled){transform:scale(0.99);}
  .choice:disabled{cursor:default;}
  .choice .letter{
    width:24px;height:24px;flex-shrink:0;border-radius:7px;
    background:var(--line);color:var(--ink-faint);font-weight:700;font-size:12.5px;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s,color .2s;
  }
  .choice.correct{background:var(--good-bg);border-color:var(--good);}
  .choice.correct .letter{background:var(--good);color:#fff;}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .choice.wrong .letter{background:var(--bad);color:#fff;}

  .open-answer{display:flex;gap:10px;}
  .open-answer input{
    flex:1;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;
    font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);
    transition:border-color .15s;
  }
  .open-answer input:focus{outline:none;border-color:var(--cyan);}
  .open-answer input.correct{border-color:var(--good);background:var(--good-bg);}
  .open-answer input.wrong{border-color:var(--bad);background:var(--bad-bg);}
  .open-answer input:disabled{color:var(--ink);}

  .feedback{
    display:flex;align-items:center;gap:9px;margin-top:20px;
    font-family:'Sora',sans-serif;font-weight:700;font-size:14.5px;
  }
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .feedback-icon svg{width:22px;height:22px;overflow:visible;}
  .feedback-icon .ring{transition:stroke-dashoffset .45s ease;}
  .feedback-icon .mark{transition:stroke-dashoffset .3s ease .3s;}

  .solution{
    margin-top:14px;padding-top:18px;border-top:1px solid var(--line);
    font-size:clamp(14px, 0.95vw, 17px);line-height:1.75;color:var(--ink-soft);
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .4s ease, opacity .3s ease .1s;
  }
  .solution.show{max-height:600px;opacity:1;}
  .solution-label{
    font-weight:700;font-size:clamp(11px,0.65vw,13px);letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:8px;display:block;
  }
  .nav-row{margin-top:24px;display:flex;justify-content:flex-end;}
  .nav-row .btn{opacity:0;pointer-events:none;transition:opacity .2s;}
  .nav-row .btn.show{opacity:1;pointer-events:auto;}

  .summary{text-align:center;padding:8px 4px 4px;}
  .ring-wrap{position:relative;width:132px;height:132px;margin:6px auto 22px;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-wrap .track{fill:none;stroke:var(--line);stroke-width:8;}
  .ring-wrap .fill{
    fill:none;stroke:var(--cyan);stroke-width:8;stroke-linecap:round;
    stroke-dasharray:339.3;stroke-dashoffset:339.3;
    transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);
  }
  .ring-wrap .num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:800;font-size:30px;color:var(--ink);
  }
  .summary h2{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;margin:0 0 6px;}
  .summary p{color:var(--ink-faint);font-size:13.5px;margin:0 0 24px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand" id="brandHome">
      <span><span class="script">Edu</span><b>X</b></span>
      <span class="dot-sep"></span>
      <span class="sub">pilot preview</span>
    </div>
    <div class="timer-pill" id="timerPill"><span class="tdot"></span><span id="timerText">25:00</span></div>
  </div>
  <div class="progress-row" id="progressRow"></div>
  <div class="card" id="card"></div>
</div>

<script>
/* ---------- question banks (all pulled from the verified pool) ---------- */

const Q_A2X = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"mcq",
  problem:"a\\cdot x+5=a-2x tenglama yechimga ega bo'lmasligi uchun a ning qiymatini toping.",
  choices:["-2","2","5","0"],correct:0,
  solution:"a x+2x=a-5 \\Rightarrow x(a+2)=a-5. Tenglama yechimga ega bo'lmasligi uchun a+2=0 va a-5\\neq0 bo'lishi kerak. Demak a=-2."};

const Q_BOOK = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"mcq",
  problem:"Birinchi kitob ikkinchisidan 75% arzon. Ikkinchi kitob birinchisidan necha foiz qimmat?",
  choices:["75%","150%","300%","25%"],correct:2,
  solution:"1-kitob = 0.25 \\times 2\\text{-kitob}. Farq: (2-kitob - 1-kitob)/1-kitob \\times 100 = 0.75/0.25 \\times 100 = 300\\%."};

const Q_MILK = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"open",
  problem:"Birinchi idishda 30 L, ikkinchisida 40 L sut bor edi. Ikkinchi idishdan birinchisiga qaraganda 2 marta ko'p sut olingach, birinchi idishda ikkinchisiga qaraganda 5 L ko'p sut qoldi. Birinchi idishdan necha litr sut olingan?",
  answer:"15",
  solution:"x — 1-idishdan olingan miqdor. (30-x)-(40-2x)=5 \\Rightarrow x-10=5 \\Rightarrow x=15."};

const Q_SIMPLIFY = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"mcq",
  problem:"Soddalashtiring: a-(a-2b+c)+2c-(b-a)",
  choices:["a-b+c","2a+b+c","a+b+c","b+c"],correct:2,
  solution:"a-(a-2b+c)+2c-(b-a) = a-a+2b-c+2c-b+a = a+b+c."};

const Q_POWERFRAC = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"mcq",
  problem:"Hisoblang: $\\dfrac{5^{2024} - 5^{2022}}{5^{2023} + 5^{2022}}$",
  choices:["4","5","20","24"],correct:0,
  solution:"Suratda: $5^{2024}-5^{2022}=5^{2022}(5^2-1)=5^{2022}\\cdot24$. Maxrajda: $5^{2023}+5^{2022}=5^{2022}\\cdot6$. Natija: 24/6=4."};

const Q_PRODDIFF = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"mcq",
  problem:"Hisoblang: $2023 \\cdot 2025 - 2021 \\cdot 2027$",
  choices:["4","6","8","12"],correct:2,
  solution:"a=2024. $2023\\cdot2025=a^2-1$, $2021\\cdot2027=a^2-9$. Ayirma: $(a^2-1)-(a^2-9)=8$."};

const Q_CUBESOPEN = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"open",
  problem:"Agar $a+b=6$ va $a\\cdot b=7$ bo'lsa, $a^3+b^3$ ifodaning qiymatini toping.",
  answer:"90",
  solution:"$a^3+b^3=(a+b)^3-3ab(a+b)=6^3-3\\cdot7\\cdot6=216-126=90$."};

const Q_SYSEQ = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"open",
  problem:"Agar $x$ va $y$ sonlari $x+2y=10$ va $2x-y=5$ tenglamalar sistemasining yechimi bo'lsa, $x^2-y^2$ ifodaning qiymatini toping.",
  answer:"7",
  solution:"$4x-2y=10$ ni 1-tenglamaga qo'shsak $5x=20 \\Rightarrow x=4$, $y=3$. $x^2-y^2=16-9=7$."};

const Q_X12 = {subject:"Matematika",grade:7,difficulty:"0.9 ball",format:"mcq",
  problem:"$x=12$ bo'lganda, $(x-2)(x^2+2x+4)-x(x-3)(x+3)$ ifodaning qiymatini hisoblang.",
  choices:["-16","100","108","116"],correct:1,
  solution:"$(x-2)(x^2+2x+4)=x^3-8$, $x(x-3)(x+3)=x^3-9x$. Ayirma: $9x-8$. $x=12$: $108-8=100$."};

const Q_CLOCK = {subject:"Matematika",grade:7,difficulty:"1.5 ball",format:"mcq",
  problem:"Soat 20:26 bo'lganda, soat mili va minut mili orasidagi kichik burchakni toping.",
  choices:["97°","87°","103°","113°"],correct:0,
  solution:"Minut mili: 26 \\times 6=156°. Soat mili: 8\\times30+ (26/60)\\times30=253°. Farq: |253-156|=97°."};

const Q_FLOOR = {subject:"Matematika",grade:7,difficulty:"1.5 ball",format:"mcq",
  problem:"x + [x] = 2026,5 tenglamaning barcha haqiqiy ildizlari yig'indisini toping. ([x] — x sonidan oshmaydigan eng katta butun son)",
  choices:["1013,5","2027","2026","1013,25"],correct:0,
  solution:"x=n+f, 2n+f=2026.5 \\Rightarrow n=1013, f=0.5 \\Rightarrow x=1013.5 (yagona ildiz)."};

const Q_DIGITSUM = {subject:"Matematika",grade:7,difficulty:"1.5 ball",format:"open",
  problem:"$(10^{20}-20)\\cdot26$ sonining raqamlari yig'indisini toping.",
  answer:"172",
  solution:"$(10^{20}-20)\\cdot26 = 2599999999999999999480$ (17 ta 9, boshida 25, oxirida 480). Raqamlar yig'indisi: 2+5+17\\cdot9+4+8+0=172."};

const Q_RIVER = {subject:"Matematika",grade:7,difficulty:"1.5 ball",format:"mcq",
  problem:"Ikki qishloq orasidagi masofa 9 km. Yo'lning bir qismi qiyalik, bir qismi tekislik. Piyoda qiyalikdan yuqoriga 4 km/soat, tekislikda 5 km/soat, qiyalikdan pastga 6 km/soat tezlikda yuradi. Borish-kelishga 3 soat 41 minut sarflagan bo'lsa, tekislik qismi necha km?",
  choices:["4","3","5","6"],correct:0,
  solution:"s (qiyalik) + f (tekislik) = 9. Vaqt: s(1/4+1/6)+f(2/5)=221/60. s=9-f qo'yib yechsak f=4 km."};

const Q_AND = {subject:"Informatika",grade:7,difficulty:"0.9 ball",format:"mcq",
  problem:"Sxemada ikkita kirish bor: A va B. Chiroq yonishi uchun A ham, B ham tok o'tkazishi kerak. Bu qaysi mantiqiy element?",
  choices:["OR","NOT","XOR","AND"],correct:3,
  solution:"Ikkala kirish ham TRUE bo'lgandagina natija TRUE bo'ladi — bu AND elementi."};

const Q_SCRATCH = {subject:"Informatika",grade:7,difficulty:"0.9 ball",format:"mcq",
  problem:"Scratch dasturlash tili: \n\nJON = 10\nrepeat until <JON = 0>\n  say [Salom]\nend\n\nBu dastur necha marta \"Salom\" deydi?",
  choices:["10 marta","1 marta","0 marta","Cheksiz (Infinite loop)"],correct:3,
  solution:"Tsikl ichida JON hech qachon o'zgartirilmaydi, shuning uchun u hech qachon 0 ga teng bo'lmaydi — cheksiz tsikl."};

const DAILY = [Q_A2X, Q_BOOK, Q_MILK, Q_POWERFRAC, Q_CUBESOPEN];

const WEEKLY = [Q_SIMPLIFY, Q_POWERFRAC, Q_PRODDIFF, Q_HEX, Q_AND, Q_SCRATCH,
                Q_CLOCK, Q_FLOOR, Q_DIGITSUM, Q_RIVER, Q_TRIANGLE_REAL, Q_SYSEQ];

const MONTHLY = [Q_MILK, Q_POWERFRAC, Q_PRODDIFF, Q_SYSEQ, Q_X12, Q_CUBESOPEN,
                 Q_CLOCK, Q_FLOOR, Q_DIGITSUM, Q_RIVER, Q_TRIANGLE_REAL, Q_TRIANGLE_SYNTH,
                 Q_ABCCOUNT, Q_MINVAL, Q_KSUM,
                 Q_HEX, Q_AND, Q_SCRATCH, Q_A2X, Q_BOOK];

const TIERS = {
  daily:   { key:"daily",   label:"Kunlik test",   free:true,  price:null,            unit:"",        timerSec:null, questions: DAILY,
             tagline:"Bepul, har kuni yangi savollar bilan mashq qiling." },
  weekly:  { key:"weekly",  label:"Haftalik test",  free:false, price:"15 000 so'm",   unit:"Bir martalik to'lov", timerSec:25*60, questions: WEEKLY,
             tagline:"Matematika + Informatika, kengroq mavzular, real vaqt bosimi bilan." },
  monthly: { key:"monthly", label:"Oylik test",     free:false, price:"45 000 so'm",   unit:"Bir martalik to'lov", timerSec:45*60, questions: MONTHLY,
             tagline:"Barcha mavzu va qiyinlik darajalari — haqiqiy olimpiadaga eng yaqin format." }
};

/* ---------- state ---------- */
let activeTierKey = null;
let current = -1;
let score = 0;
let answered = false;
let purchased = { weekly:false, monthly:false };
let timerInterval = null;
let timeLeft = 0;

const ICON_CHECK = '<svg viewBox="0 0 36 36" fill="none"><circle class="ring" cx="18" cy="18" r="15" stroke="currentColor" stroke-width="2.6" style="stroke-dasharray:95;stroke-dashoffset:95"/><path class="mark" d="M11 18.5L15.5 23L25 12.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:22;stroke-dashoffset:22"/></svg>';
const ICON_CROSS = '<svg viewBox="0 0 36 36" fill="none"><circle class="ring" cx="18" cy="18" r="15" stroke="currentColor" stroke-width="2.6" style="stroke-dasharray:95;stroke-dashoffset:95"/><path class="mark" d="M13 13L23 23M23 13L13 23" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:29;stroke-dashoffset:29"/></svg>';

function questionsOf(key){ return TIERS[key].questions; }

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  document.getElementById('timerPill').classList.remove('show');
}

function startTimer(seconds){
  stopTimer();
  timeLeft = seconds;
  const pill = document.getElementById('timerPill');
  const text = document.getElementById('timerText');
  pill.classList.add('show');
  pill.classList.remove('low');
  const tick = () => {
    const m = Math.floor(timeLeft/60), s = timeLeft%60;
    text.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if(timeLeft <= seconds*0.15) pill.classList.add('low');
    if(timeLeft <= 0){ clearInterval(timerInterval); timerInterval = null; return; }
    timeLeft--;
  };
  tick();
  timerInterval = setInterval(tick, 1000);
}

function goHome(){
  stopTimer();
  activeTierKey = null; current = -1; score = 0;
  renderProgress();
  renderHub();
}
document.getElementById('brandHome').addEventListener('click', goHome);

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  if(!activeTierKey || current < 0){ row.style.visibility='hidden'; return; }
  row.style.visibility='visible';
  const qs = questionsOf(activeTierKey);
  qs.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'seg' + (current > i ? ' done' : current === i ? ' current' : '');
    row.appendChild(d);
  });
}

function renderHub(){
  const card = document.getElementById('card');
  const rows = Object.values(TIERS).map(t => {
    const priceHtml = t.free
      ? `<div class="tprice free">Bepul</div>`
      : `<div class="tprice">${t.price}</div><div class="tunit">${t.unit}</div>`;
    const lock = (!t.free && !purchased[t.key]) ? `<div class="lock-badge">To'lov talab qilinadi</div>` : '';
    return `
      <div class="tier-card" data-key="${t.key}">
        <div>
          <div class="tname">${t.label}</div>
          <div class="tmeta">${t.questions.length} ta savol${t.timerSec ? ' · ' + Math.round(t.timerSec/60) + ' daqiqa' : ''}</div>
          ${lock}
        </div>
        <div class="tright">${priceHtml}</div>
      </div>`;
  }).join('');

  card.innerHTML = `
    <div class="hub-title">
      <h1>Test to'plamlari</h1>
      <p>Jamoa uchun — barcha darajalarni shu yerdan sinab ko'ring</p>
    </div>
    <div class="hub-grid">${rows}</div>
  `;
  document.querySelectorAll('.tier-card').forEach(el=>{
    el.addEventListener('click', () => selectTier(el.dataset.key));
  });
}

function selectTier(key){
  activeTierKey = key;
  const t = TIERS[key];
  if(t.free || purchased[key]){
    current = -1;
    renderIntro();
  } else {
    renderPaywall();
  }
}

function renderPaywall(){
  const t = TIERS[activeTierKey];
  document.getElementById('card').innerHTML = `
    <div class="intro">
      <h1>${t.label}</h1>
      <div class="pills">
        <span class="pill">${t.questions.length} ta savol</span>
        <span class="pill">${Math.round(t.timerSec/60)} daqiqa</span>
      </div>
      <p>${t.tagline}</p>
      <div class="price-tag">${t.price}</div>
      <div class="mock-note" style="margin-top:-10px;margin-bottom:6px;">${t.unit}</div>
      <div class="btn-row">
        <button class="btn ghost" id="backBtn">Orqaga</button>
        <button class="btn" id="buyBtn">Sotib olish (mock)</button>
      </div>
      <div class="mock-note">Bu — sinov rejimi. Haqiqiy to'lov amalga oshirilmaydi.</div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('buyBtn').addEventListener('click', () => {
    purchased[activeTierKey] = true;
    current = -1;
    renderIntro();
  });
}

function renderIntro(){
  const t = TIERS[activeTierKey];
  const subjects = [...new Set(t.questions.map(q=>q.subject))].join(' · ');
  document.getElementById('card').innerHTML = `
    <div class="intro">
      <h1>${t.label}</h1>
      <div class="pills">
        <span class="pill">${subjects}</span>
        <span class="pill">7-sinf</span>
        <span class="pill">${t.questions.length} ta savol</span>
        ${t.timerSec ? `<span class="pill">${Math.round(t.timerSec/60)} daqiqa</span>` : ''}
      </div>
      <p>${t.tagline} Har bir savoldan so'ng to'g'ri javob va yechim ko'rsatiladi.</p>
      <div class="btn-row">
        <button class="btn ghost" id="backBtn">Orqaga</button>
        <button class="btn" id="startBtn">Testni boshlash</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('startBtn').addEventListener('click', () => {
    current = 0;
    renderProgress();
    if(t.timerSec) startTimer(t.timerSec);
    renderQuestion();
  });
}

function renderTriangleDiagram(spec){
  return `<svg viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg">
    <polygon points="110,15 30,155 195,155" fill="none" stroke="#303069" stroke-width="1.6"/>
    <line x1="30" y1="155" x2="110" y2="15" stroke="#303069" stroke-width="1.1" opacity="0.55"/>
    <line x1="60" y1="85" x2="195" y2="155" stroke="#303069" stroke-width="1.1" opacity="0.85"/>
    <line x1="110" y1="155" x2="110" y2="15" stroke="#303069" stroke-width="1.1" opacity="0.85"/>
    <circle cx="110" cy="15" r="2.4" fill="#303069"/>
    <circle cx="30" cy="155" r="2.4" fill="#303069"/>
    <circle cx="195" cy="155" r="2.4" fill="#303069"/>
    <circle cx="60" cy="85" r="2.4" fill="#303069"/>
    <circle cx="110" cy="155" r="2.4" fill="#303069"/>
    <circle cx="98" cy="120" r="2.6" fill="#1cbeee"/>
    <text x="106" y="10" font-size="11" fill="#1a1f2e" font-family="Inter">C</text>
    <text x="14" y="168" font-size="11" fill="#1a1f2e" font-family="Inter">A</text>
    <text x="200" y="168" font-size="11" fill="#1a1f2e" font-family="Inter">B</text>
    <text x="42" y="82" font-size="11" fill="#1a1f2e" font-family="Inter">E</text>
    <text x="106" y="172" font-size="11" fill="#1a1f2e" font-family="Inter">D</text>
    <text x="102" y="113" font-size="11" fill="#1cbeee" font-family="Inter" font-weight="700">F</text>
    <text x="26" y="145" font-size="10" fill="#5b6072" font-family="Inter">${spec.angleA}</text>
    <text x="103" y="132" font-size="10" fill="#5b6072" font-family="Inter">${spec.angleF}</text>
  </svg>`;
}

function renderQuestion(){
  answered = false;
  const t = TIERS[activeTierKey];
  const q = t.questions[current];
  const card = document.getElementById('card');

  let mediaHtml = '';
  if (q.image) mediaHtml = `<div class="diagram-box"><img src="${q.image}" alt="diagram"/></div>`;
  else if (q.diagramSpec) mediaHtml = `<div class="diagram-box">${renderTriangleDiagram(q.diagramSpec)}</div>`;

  let answerHtml = '';
  if (q.format === 'open') {
    answerHtml = `
      <div class="open-answer">
        <input type="text" id="openInput" placeholder="Javobni kiriting..." />
        <button class="btn" id="checkBtn">Tekshirish</button>
      </div>`;
  } else {
    answerHtml = `
      <div class="choices">
        ${q.choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`).join('')}
      </div>`;
  }

  card.innerHTML = `
    <div class="meta">${q.subject} · ${q.grade}-sinf · ${q.difficulty} · <b>${current+1}/${t.questions.length}</b>${q.sourceTag ? `<span class="src-tag">${q.sourceTag}</span>` : ''}</div>
    ${mediaHtml}
    <div class="problem">${q.problem}</div>
    ${answerHtml}
    <div id="feedbackBox"></div>
    <div class="solution" id="solutionBox">
      <span class="solution-label">Yechim</span>
      <div id="solutionText"></div>
    </div>
    <div class="nav-row">
      <button class="btn" id="nextBtn">${current === t.questions.length-1 ? "Natijani ko'rish" : "Keyingi savol"}</button>
    </div>
  `;

  if (q.format === 'open') {
    document.getElementById('checkBtn').addEventListener('click', handleOpenAnswer);
    document.getElementById('openInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleOpenAnswer(); });
  } else {
    document.querySelectorAll('.choice').forEach(btn=>{
      btn.addEventListener('click', ()=>handleAnswer(parseInt(btn.dataset.i)));
    });
  }
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  renderMathInElement(card, { delimiters: [{left:"$", right:"$", display:false}] });
}

function showFeedback(isCorrect){
  if(isCorrect) score++;
  const fb = document.getElementById('feedbackBox');
  fb.innerHTML = `
    <div class="feedback ${isCorrect ? 'good' : 'bad'}">
      <span class="feedback-icon">${isCorrect ? ICON_CHECK : ICON_CROSS}</span>
      ${isCorrect ? "To'g'ri javob!" : "Noto'g'ri javob"}
    </div>`;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      fb.querySelectorAll('.ring, .mark').forEach(el => el.style.strokeDashoffset = 0);
    });
  });
  const q = TIERS[activeTierKey].questions[current];
  document.getElementById('solutionText').innerHTML = q.solution;
  const box = document.getElementById('solutionBox');
  box.classList.add('show');
  renderMathInElement(box, { delimiters: [{left:"$", right:"$", display:false}] });
  document.getElementById('nextBtn').classList.add('show');
}

function handleAnswer(i){
  if(answered) return;
  answered = true;
  const q = TIERS[activeTierKey].questions[current];
  const isCorrect = i === q.correct;
  document.querySelectorAll('.choice').forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx === q.correct) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('wrong');
  });
  showFeedback(isCorrect);
}

function handleOpenAnswer(){
  if(answered) return;
  answered = true;
  const q = TIERS[activeTierKey].questions[current];
  const input = document.getElementById('openInput');
  const given = input.value.trim().replace(',', '.');
  const numMatch = given !== '' && !isNaN(parseFloat(given)) && Math.abs(parseFloat(given) - parseFloat(q.answer)) < 0.01;
  const strMatch = given.toLowerCase() === q.answer.toLowerCase();
  const isCorrect = numMatch || strMatch;
  input.disabled = true;
  document.getElementById('checkBtn').disabled = true;
  input.classList.add(isCorrect ? 'correct' : 'wrong');
  showFeedback(isCorrect);
}

function nextQuestion(){
  const t = TIERS[activeTierKey];
  if(current < t.questions.length - 1){
    current++;
    renderProgress();
    renderQuestion();
  } else {
    current = t.questions.length;
    renderProgress();
    stopTimer();
    renderSummary();
  }
}

function renderSummary(){
  const t = TIERS[activeTierKey];
  const pct = score / t.questions.length;
  const headline = pct === 1 ? "Zo'r natija!" : pct >= 0.6 ? "Yaxshi natija!" : "Mashq qilishda davom eting";
  document.getElementById('card').innerHTML = `
    <div class="summary">
      <div class="ring-wrap">
        <svg viewBox="0 0 128 128">
          <circle class="track" cx="64" cy="64" r="54"/>
          <circle class="fill" id="ringFill" cx="64" cy="64" r="54"/>
        </svg>
        <div class="num">${score}/${t.questions.length}</div>
      </div>
      <h2>${headline}</h2>
      <p>${t.label} · To'g'ri javoblar soni</p>
      <div class="btn-row">
        <button class="btn ghost" id="homeBtn">Bosh sahifa</button>
        <button class="btn" id="restartBtn">Qaytadan boshlash</button>
      </div>
    </div>
  `;
  const circumference = 339.3;
  const offset = circumference * (1 - pct);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.getElementById('ringFill').style.strokeDashoffset = offset;
    });
  });
  document.getElementById('homeBtn').addEventListener('click', goHome);
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    current = -1; score = 0;
    renderProgress();
    renderIntro();
  });
}

renderProgress();
renderHub();
</script>
</body>
</html>
